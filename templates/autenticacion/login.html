{% extends 'base.html' %}

{% block title %}Iniciar Sesión - SIGAE{% endblock %}

{% block body_wrapper %}
<div class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-logo">SIGAE</h1>
            <p class="login-subtitle">Academia Preuniversitaria Euler</p>
        </div>
        
        {% if messages %}
            <div style="margin-bottom: 1.5rem;">
                {% for message in messages %}
                    <div class="badge badge-danger" style="display: block; width: 100%; padding: 0.5rem; text-align: center; margin-bottom: 0.5rem; text-transform: none;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'iniciar_sesion' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Ej. jperez" required autocomplete="username">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                Ingresar al Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
